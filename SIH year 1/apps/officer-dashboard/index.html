<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Municipal Officer Command Dashboard | SIH 2026</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Leaflet.js CSS for OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f7ff',
                500: '#0284c7',
                600: '#0369a1',
                700: '#075985',
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Custom CSS Styles -->
    <style>
      .glass-card {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .leaflet-container {
        width: 100%;
        height: 100%;
        border-radius: 1.5rem;
        background: #0f172a;
      }
      .leaflet-popup-content-wrapper {
        background: #0f172a;
        color: #f8fafc;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        padding: 0.5rem;
      }
      .leaflet-popup-tip {
        background: #0f172a;
      }
    </style>

    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const DEPARTMENTS = [
        "All Departments",
        "Roads & Infrastructure",
        "Water Supply & Sewage",
        "Electricity & Public Lighting",
        "Waste Management & Sanitation",
        "Public Health"
      ];

      const URGENCIES = ["All Urgencies", "CRITICAL", "HIGH", "MEDIUM", "LOW"];
      const STATUSES = ["All Statuses", "PENDING", "IN_PROGRESS", "RESOLVED", "REJECTED"];

      // 1. MetricHeader Component
      function MetricHeader({ complaints }) {
        const total = complaints.length;
        const critical = complaints.filter(c => c.urgency === 'CRITICAL' || c.urgency === 'HIGH').length;
        const pending = complaints.filter(c => c.status === 'PENDING').length;
        const resolved = complaints.filter(c => c.status === 'RESOLVED').length;

        return (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div className="glass-card rounded-3xl p-5 border border-slate-800 flex items-center justify-between">
              <div>
                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400">Total Grievances</span>
                <div className="text-3xl font-extrabold text-slate-100 mt-1">{total}</div>
                <span className="text-[10px] text-cyan-400 mt-1 block">Active Ingestion Stream</span>
              </div>
              <div className="w-12 h-12 rounded-2xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-2xl font-bold">
                📊
              </div>
            </div>

            <div className="glass-card rounded-3xl p-5 border border-rose-500/30 flex items-center justify-between">
              <div>
                <span className="text-[11px] font-bold uppercase tracking-wider text-rose-400">Critical & High</span>
                <div className="text-3xl font-extrabold text-rose-300 mt-1">{critical}</div>
                <span className="text-[10px] text-rose-400/80 mt-1 block">Priority Emergency Alerts</span>
              </div>
              <div className="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-2xl font-bold animate-pulse">
                ⚠️
              </div>
            </div>

            <div className="glass-card rounded-3xl p-5 border border-amber-500/30 flex items-center justify-between">
              <div>
                <span className="text-[11px] font-bold uppercase tracking-wider text-amber-400">Pending Approval</span>
                <div className="text-3xl font-extrabold text-amber-300 mt-1">{pending}</div>
                <span className="text-[10px] text-amber-400/80 mt-1 block">Awaiting Officer Dispatch</span>
              </div>
              <div className="w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-2xl font-bold">
                ⏳
              </div>
            </div>

            <div className="glass-card rounded-3xl p-5 border border-emerald-500/30 flex items-center justify-between">
              <div>
                <span className="text-[11px] font-bold uppercase tracking-wider text-emerald-400">Resolved Cases</span>
                <div className="text-3xl font-extrabold text-emerald-300 mt-1">{resolved}</div>
                <span className="text-[10px] text-emerald-400/80 mt-1 block">Closed & Verified</span>
              </div>
              <div className="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl font-bold">
                ✅
              </div>
            </div>
          </div>
        );
      }

      // 2. FilterToolbar Component
      function FilterToolbar({ department, setDepartment, urgency, setUrgency, status, setStatus, onRefresh, isLoading }) {
        return (
          <div className="glass-card rounded-3xl p-4 sm:p-6 mb-8 border border-slate-800 flex flex-wrap items-center justify-between gap-4">
            <div className="flex flex-wrap items-center gap-3 w-full lg:w-auto">
              <div className="flex flex-col">
                <label className="text-[10px] font-bold uppercase text-slate-400 mb-1">Department</label>
                <select
                  value={department}
                  onChange={(e) => setDepartment(e.target.value)}
                  className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs font-semibold text-slate-200 focus:outline-none focus:border-cyan-500 cursor-pointer"
                >
                  {DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}
                </select>
              </div>

              <div className="flex flex-col">
                <label className="text-[10px] font-bold uppercase text-slate-400 mb-1">Urgency</label>
                <select
                  value={urgency}
                  onChange={(e) => setUrgency(e.target.value)}
                  className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs font-semibold text-slate-200 focus:outline-none focus:border-cyan-500 cursor-pointer"
                >
                  {URGENCIES.map(u => <option key={u} value={u}>{u}</option>)}
                </select>
              </div>

              <div className="flex flex-col">
                <label className="text-[10px] font-bold uppercase text-slate-400 mb-1">Status</label>
                <select
                  value={status}
                  onChange={(e) => setStatus(e.target.value)}
                  className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs font-semibold text-slate-200 focus:outline-none focus:border-cyan-500 cursor-pointer"
                >
                  {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
            </div>

            <button
              onClick={onRefresh}
              disabled={isLoading}
              className="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-bold text-slate-200 flex items-center gap-2 transition-all ml-auto"
            >
              <span>{isLoading ? '⌛' : '🔄'}</span>
              <span>Refresh Data</span>
            </button>
          </div>
        );
      }

      // 3. InteractiveMap Component (Leaflet OpenStreetMap)
      function InteractiveMap({ complaints, onSelectComplaint }) {
        const mapContainerRef = useRef(null);
        const mapInstanceRef = useRef(null);

        useEffect(() => {
          if (!mapContainerRef.current) return;

          if (!mapInstanceRef.current) {
            // Initialize Leaflet Map centered on Bangalore
            const map = L.map(mapContainerRef.current).setView([12.9716, 77.5946], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              maxZoom: 19,
              attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            mapInstanceRef.current = map;
          }

          const map = mapInstanceRef.current;
          
          // Clear existing markers
          map.eachLayer((layer) => {
            if (layer instanceof L.Marker) {
              map.removeLayer(layer);
            }
          });

          // Custom Marker Icon SVG Builder
          const createCustomIcon = (urgency) => {
            let color = '#10b981'; // Green (LOW)
            if (urgency === 'CRITICAL' || urgency === 'HIGH') color = '#ef4444'; // Red
            else if (urgency === 'MEDIUM') color = '#f59e0b'; // Yellow/Orange

            const svg = `
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="${color}" width="32" height="32" stroke="#0f172a" stroke-width="1.5">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
              </svg>
            `;
            return L.divIcon({
              html: svg,
              className: 'custom-leaflet-pin',
              iconSize: [32, 32],
              iconAnchor: [16, 32],
              popupAnchor: [0, -32]
            });
          };

          // Render Pins for Complaints
          complaints.forEach((c, idx) => {
            const lat = c.lat || (12.9716 + (idx * 0.008) - 0.015);
            const lng = c.long || (77.5946 + (idx * 0.009) - 0.015);

            const marker = L.marker([lat, lng], { icon: createCustomIcon(c.urgency) }).addTo(map);
            
            const popupContent = `
              <div class="text-xs space-y-1 p-1">
                <div class="font-mono font-bold text-cyan-400">${c.tracking_id}</div>
                <div class="font-semibold text-slate-200">${c.department_name || (c.departments && c.departments.name) || 'General Municipal'}</div>
                <div class="text-slate-400 text-[11px] truncate max-w-[200px]">${c.translated_text || c.raw_text}</div>
                <div class="pt-2">
                  <button id="btn-${c.id}" class="w-full py-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded text-[11px]">
                    Inspect Grievance →
                  </button>
                </div>
              </div>
            `;
            marker.bindPopup(popupContent);

            marker.on('popupopen', () => {
              const btn = document.getElementById(`btn-${c.id}`);
              if (btn) {
                btn.onclick = () => onSelectComplaint(c);
              }
            });
          });

        }, [complaints]);

        return (
          <div className="glass-card rounded-3xl p-4 mb-8 border border-slate-800 h-[380px] sm:h-[450px] relative overflow-hidden">
            <div className="absolute top-6 left-6 z-[1000] bg-slate-900/90 border border-slate-800 rounded-xl px-3 py-1.5 backdrop-blur-md flex items-center gap-3 text-xs">
              <span className="font-bold text-slate-200">GIS Heatmap Legend:</span>
              <span className="flex items-center gap-1 text-rose-400 font-semibold"><span className="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Critical/High</span>
              <span className="flex items-center gap-1 text-amber-400 font-semibold"><span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Medium</span>
              <span className="flex items-center gap-1 text-emerald-400 font-semibold"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Low</span>
            </div>
            <div ref={mapContainerRef} className="w-full h-full rounded-2xl" />
          </div>
        );
      }

      // 4. ComplaintTable Component
      function ComplaintTable({ complaints, onSelectComplaint }) {
        const getUrgencyClass = (urgency) => {
          switch (urgency) {
            case 'CRITICAL': return 'bg-rose-500/20 text-rose-300 border-rose-500/40';
            case 'HIGH': return 'bg-amber-500/20 text-amber-300 border-amber-500/40';
            case 'MEDIUM': return 'bg-yellow-500/20 text-yellow-300 border-yellow-500/40';
            default: return 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40';
          }
        };

        const getStatusClass = (status) => {
          switch (status) {
            case 'RESOLVED': return 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40';
            case 'IN_PROGRESS': return 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40 animate-pulse';
            case 'REJECTED': return 'bg-rose-500/20 text-rose-300 border-rose-500/40';
            default: return 'bg-amber-500/20 text-amber-300 border-amber-500/40';
          }
        };

        return (
          <div className="glass-card rounded-3xl border border-slate-800 overflow-hidden shadow-2xl mb-8">
            <div className="p-5 border-b border-slate-800 flex items-center justify-between">
              <h3 className="text-lg font-bold text-slate-100 flex items-center gap-2">
                📋 Municipal Grievance Ingestion Stream
              </h3>
              <span className="text-xs font-medium text-slate-400">{complaints.length} Records</span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-slate-300">
                <thead className="bg-slate-900/90 text-slate-400 font-bold uppercase tracking-wider text-[10px] border-b border-slate-800">
                  <tr>
                    <th className="py-3.5 px-4">Tracking Code</th>
                    <th className="py-3.5 px-4">Summary</th>
                    <th className="py-3.5 px-4">Assigned Department</th>
                    <th className="py-3.5 px-4">Urgency</th>
                    <th className="py-3.5 px-4">Status</th>
                    <th className="py-3.5 px-4 text-right">Action</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60">
                  {complaints.length === 0 ? (
                    <tr>
                      <td colSpan="6" className="py-8 text-center text-slate-500 text-sm">
                        No grievances match the specified filter controls.
                      </td>
                    </tr>
                  ) : (
                    complaints.map((item) => (
                      <tr
                        key={item.id}
                        onClick={() => onSelectComplaint(item)}
                        className="hover:bg-slate-900/60 transition-colors cursor-pointer group"
                      >
                        <td className="py-3.5 px-4 font-mono font-bold text-cyan-400">
                          {item.tracking_id}
                          {item.photo_url && (
                            <span className="inline-flex items-center gap-1 ml-2 px-1.5 py-0.5 rounded text-[9px] font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40">
                              📷 Photo
                            </span>
                          )}
                          {item.audio_url && (
                            <span className="inline-flex items-center gap-1 ml-1 px-1.5 py-0.5 rounded text-[9px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40">
                              🎙️ Audio
                            </span>
                          )}
                        </td>
                        <td className="py-3.5 px-4 max-w-xs truncate text-slate-200">{item.translated_text || item.raw_text}</td>
                        <td className="py-3.5 px-4 font-semibold text-slate-300">{item.department_name || (item.departments && item.departments.name) || 'General Municipal'}</td>
                        <td className="py-3.5 px-4">
                          <span className={`px-2 py-0.5 text-[10px] font-bold rounded border ${getUrgencyClass(item.urgency)}`}>
                            {item.urgency}
                          </span>
                        </td>
                        <td className="py-3.5 px-4">
                          <span className={`px-2 py-0.5 text-[10px] font-bold rounded border ${getStatusClass(item.status)}`}>
                            {item.status}
                          </span>
                        </td>
                        <td className="py-3.5 px-4 text-right">
                          <button
                            type="button"
                            onClick={(e) => { e.stopPropagation(); onSelectComplaint(item); }}
                            className="px-3 py-1.5 bg-cyan-600/20 hover:bg-cyan-600 text-cyan-300 hover:text-white rounded-lg text-[11px] font-bold transition-all border border-cyan-500/30"
                          >
                            Inspect & Dispatch →
                          </button>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      // 5. DetailModal Component
      function DetailModal({ complaint, onClose, onUpdateStatus }) {
        if (!complaint) return null;

        const [selectedStatus, setSelectedStatus] = useState(complaint.status);
        const [officerNotes, setOfficerNotes] = useState('');
        const [isUpdating, setIsUpdating] = useState(false);
        const [updateSuccess, setUpdateSuccess] = useState(false);
        const [errorMsg, setErrorMsg] = useState(null);
        const [showLightbox, setShowLightbox] = useState(false);

        useEffect(() => {
          if (complaint) {
            setSelectedStatus(complaint.status);
            setOfficerNotes('');
            setErrorMsg(null);
          }
        }, [complaint]);

        const handleStatusSubmit = async (e) => {
          e.preventDefault();
          setIsUpdating(true);
          setErrorMsg(null);

          try {
            const baseUrl = typeof window !== 'undefined' && window.location.origin.includes('http')
              ? `${window.location.origin}/api/complaints/${complaint.id}/status`
              : `http://127.0.0.1:8000/api/complaints/${complaint.id}/status`;

            const res = await fetch(baseUrl, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                status: selectedStatus,
                notes: officerNotes || `Status updated to ${selectedStatus} by Officer`
              })
            });

            if (!res.ok) {
              const err = await res.json();
              throw new Error(err.detail || 'Failed to update complaint status.');
            }

            const updatedData = await res.json();
            setUpdateSuccess(true);
            setTimeout(() => setUpdateSuccess(false), 2000);
            onUpdateStatus(updatedData);
          } catch (err) {
            setErrorMsg(err.message || 'Network error updating status.');
          } finally {
            setIsUpdating(false);
          }
        };

        return (
          <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
            <div className="glass-card rounded-3xl p-6 sm:p-8 max-w-2xl w-full border border-slate-800 shadow-2xl relative max-h-[90vh] overflow-y-auto">
              <button
                onClick={onClose}
                className="absolute top-6 right-6 text-slate-400 hover:text-white text-xl font-bold w-8 h-8 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center"
              >
                ✕
              </button>

              <div className="flex items-center gap-3 mb-6">
                <div className="w-10 h-10 rounded-2xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-extrabold text-lg">
                  🏛️
                </div>
                <div>
                  <span className="text-[10px] uppercase font-bold text-slate-400">Grievance Inspector</span>
                  <h3 className="text-xl font-mono font-extrabold text-cyan-400">{complaint.tracking_id}</h3>
                </div>
              </div>

              {errorMsg && (
                <div className="mb-4 p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-300 text-xs">
                  ⚠️ {errorMsg}
                </div>
              )}

              {updateSuccess && (
                <div className="mb-4 p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-300 text-xs">
                  ✅ Status updated successfully!
                </div>
              )}

              <div className="space-y-4 mb-6">
                {/* Summary & Raw Text */}
                <div className="p-4 bg-slate-900/60 rounded-2xl border border-slate-800 space-y-3">
                  <div>
                    <span className="text-xs font-extrabold text-cyan-400 uppercase tracking-wider block mb-1">🚨 Core Civic Problem Summary</span>
                    <p className="text-base text-slate-100 font-semibold leading-relaxed">{complaint.translated_text || complaint.raw_text}</p>
                  </div>

                  {complaint.raw_text && (
                    <div className="pt-2 border-t border-slate-800/80">
                      <span className="text-[10px] uppercase text-slate-400 font-bold block">🎙️ Audio Transcription / Spoken Words</span>
                      <p className="text-xs text-slate-300 italic pt-0.5">"{complaint.raw_text}"</p>
                    </div>
                  )}
                </div>

                {/* Citizen Audio Recording Player */}
                {complaint.audio_url ? (
                  <div className="p-3.5 bg-slate-900/80 rounded-2xl border border-slate-800 space-y-2">
                    <div className="flex items-center justify-between text-xs text-slate-300 font-semibold">
                      <span className="flex items-center gap-1.5 text-cyan-400 font-bold">
                        <span>🎙️ Original Citizen Voice Recording</span>
                      </span>
                      <span className="text-[10px] text-emerald-400 font-mono">Active (Will purge on Resolve/Reject)</span>
                    </div>
                    <audio src={complaint.audio_url} controls className="w-full h-9 rounded-xl" />
                  </div>
                ) : (
                  <div className="p-3 bg-slate-900/40 rounded-xl border border-slate-800/60 text-slate-500 text-[11px] flex items-center justify-between">
                    <span>🎙️ Voice Recording: None attached or purged upon complaint resolution/rejection</span>
                  </div>
                )}

                {/* Metadata Grid */}
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
                  <div className="p-3 bg-slate-900/40 rounded-xl border border-slate-800">
                    <span className="text-[10px] uppercase text-slate-400 block">Department</span>
                    <span className="font-bold text-slate-200">{complaint.department_name || (complaint.departments && complaint.departments.name) || 'General Municipal'}</span>
                  </div>
                  <div className="p-3 bg-slate-900/40 rounded-xl border border-slate-800">
                    <span className="text-[10px] uppercase text-slate-400 block">Urgency</span>
                    <span className="font-bold text-amber-400">{complaint.urgency}</span>
                  </div>
                  <div className="p-3 bg-slate-900/40 rounded-xl border border-slate-800">
                    <span className="text-[10px] uppercase text-slate-400 block">Citizen Contact</span>
                    <span className="font-mono text-slate-200">{complaint.citizen_phone}</span>
                  </div>
                </div>

                {/* Evidence Photo Preview */}
                <div>
                  <span className="text-xs font-semibold text-slate-400 block mb-2">Attached Photo / Field Evidence</span>
                  <div className="w-full h-48 bg-slate-900 rounded-2xl border border-slate-800 flex items-center justify-center overflow-hidden relative group">
                    {complaint.photo_url ? (
                      <>
                        <img src={complaint.photo_url} alt="Grievance Evidence Photo" className="w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-slate-950/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                          <button
                            type="button"
                            onClick={() => setShowLightbox(true)}
                            className="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl text-xs font-bold shadow-xl flex items-center gap-1.5"
                          >
                            🔍 View Full Image
                          </button>
                        </div>
                      </>
                    ) : (
                      <div className="text-center text-slate-500 text-xs py-6">
                        <span className="text-2xl block mb-1">📷</span>
                        <span>No Photo Uploaded for this Grievance</span>
                      </div>
                    )}
                  </div>
                </div>

                {/* Photo Lightbox Overlay */}
                {showLightbox && complaint.photo_url && (
                  <div
                    className="fixed inset-0 z-[100] bg-slate-950/90 backdrop-blur-lg flex items-center justify-center p-4"
                    onClick={() => setShowLightbox(false)}
                  >
                    <div className="relative max-w-4xl w-full max-h-[90vh] flex flex-col items-center">
                      <button
                        onClick={() => setShowLightbox(false)}
                        className="absolute top-4 right-4 text-white text-xl font-bold w-10 h-10 rounded-full bg-slate-900/80 border border-slate-700 flex items-center justify-center"
                      >
                        ✕
                      </button>
                      <img
                        src={complaint.photo_url}
                        alt="Evidence Full View"
                        className="max-w-full max-h-[85vh] rounded-2xl border border-slate-800 object-contain shadow-2xl"
                      />
                    </div>
                  </div>
                )}
              </div>

              {/* Clean Status Update Form */}
              <form onSubmit={handleStatusSubmit} className="pt-4 border-t border-slate-800 space-y-4">
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-300">Update Officer Dispatch Status</h4>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-[11px] font-semibold text-slate-400 mb-1">New Status</label>
                    <select
                      value={selectedStatus}
                      onChange={(e) => setSelectedStatus(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs font-bold text-slate-100 focus:outline-none focus:border-cyan-500 cursor-pointer"
                    >
                      <option value="PENDING">PENDING</option>
                      <option value="IN_PROGRESS">IN_PROGRESS</option>
                      <option value="RESOLVED">RESOLVED</option>
                      <option value="REJECTED">REJECTED</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-[11px] font-semibold text-slate-400 mb-1">Dispatch Notes</label>
                    <input
                      type="text"
                      value={officerNotes}
                      onChange={(e) => setOfficerNotes(e.target.value)}
                      placeholder="e.g. Work inspected and completed by field team"
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                    />
                  </div>
                </div>

                <div className="flex gap-3 pt-2">
                  <button
                    type="submit"
                    disabled={isUpdating}
                    className="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold text-xs rounded-xl shadow-lg hover:from-cyan-400 hover:to-blue-500 cursor-pointer"
                  >
                    {isUpdating ? '⌛ Updating Database...' : '🚀 Submit Officer Update'}
                  </button>
                  <button
                    type="button"
                    onClick={onClose}
                    className="py-3 px-5 bg-slate-900 text-slate-400 text-xs font-semibold rounded-xl border border-slate-800 hover:text-white cursor-pointer"
                  >
                    Cancel
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      // App Main Layout
      function App() {
        const [complaints, setComplaints] = useState([]);
        const [department, setDepartment] = useState("All Departments");
        const [urgency, setUrgency] = useState("All Urgencies");
        const [status, setStatus] = useState("All Statuses");
        const [selectedComplaint, setSelectedComplaint] = useState(null);
        const [isLoading, setIsLoading] = useState(false);

        const fetchComplaints = async () => {
          setIsLoading(true);
          try {
            const baseUrl = typeof window !== 'undefined' && window.location.origin.includes('http') 
              ? `${window.location.origin}/api/complaints` 
              : 'http://127.0.0.1:8000/api/complaints';

            let url = baseUrl;
            const params = new URLSearchParams();
            if (department !== "All Departments") params.append('department', department);
            if (urgency !== "All Urgencies") params.append('urgency', urgency);
            if (status !== "All Statuses") params.append('status', status);

            if (params.toString()) url += `?${params.toString()}`;

            const res = await fetch(url);
            if (res.ok) {
              const data = await res.json();
              setComplaints(data);
            }
          } catch (err) {
            console.error('Fetch complaints error:', err);
          } finally {
            setIsLoading(false);
          }
        };

        useEffect(() => {
          fetchComplaints();
        }, [department, urgency, status]);

        const handleUpdateStatus = (updatedComplaint) => {
          setComplaints(prev => prev.map(c => c.id === updatedComplaint.id ? { ...c, ...updatedComplaint } : c));
          fetchComplaints();
        };

        const handleQuickStatusUpdate = async (complaintId, newStatus) => {
          try {
            const baseUrl = typeof window !== 'undefined' && window.location.origin.includes('http') 
              ? `${window.location.origin}/api/complaints/${complaintId}/status` 
              : `http://127.0.0.1:8000/api/complaints/${complaintId}/status`;

            const res = await fetch(baseUrl, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                status: newStatus,
                notes: `Status marked as ${newStatus} directly from Municipal Dashboard Table`
              })
            });

            if (res.ok) {
              fetchComplaints();
            }
          } catch (err) {
            console.error('Quick status update error:', err);
          }
        };

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between selection:bg-cyan-500 selection:text-slate-950">
            {/* Header */}
            <header className="sticky top-0 z-40 glass-card border-b border-slate-800/80 px-4 sm:px-8 py-4 backdrop-blur-xl">
              <div className="max-w-7xl mx-auto flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white text-xl shadow-lg shadow-cyan-500/25">
                    🏛️
                  </div>
                  <div>
                    <h1 className="text-base sm:text-lg font-extrabold text-slate-100 flex items-center gap-2">
                      Municipal Command Dashboard
                      <span className="hidden sm:inline-block px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                        ● LIVE FEED
                      </span>
                    </h1>
                    <p className="text-[11px] text-slate-400 font-medium">Smart City Civic Grievance Monitoring & Officer Dispatch</p>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                  <span className="text-xs font-mono font-bold text-slate-300">Supabase DB Sync</span>
                </div>
              </div>
            </header>

            {/* Content */}
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-8 py-8">
              <MetricHeader complaints={complaints} />

              <FilterToolbar
                department={department}
                setDepartment={setDepartment}
                urgency={urgency}
                setUrgency={setUrgency}
                status={status}
                setStatus={setStatus}
                onRefresh={fetchComplaints}
                isLoading={isLoading}
              />

              <InteractiveMap complaints={complaints} onSelectComplaint={setSelectedComplaint} />

              <ComplaintTable complaints={complaints} onSelectComplaint={setSelectedComplaint} onQuickStatusUpdate={handleQuickStatusUpdate} />
            </main>

            {/* Detail Modal */}
            {selectedComplaint && (
              <DetailModal
                complaint={selectedComplaint}
                onClose={() => setSelectedComplaint(null)}
                onUpdateStatus={handleUpdateStatus}
              />
            )}

            <footer className="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500 bg-slate-950">
              SIH Municipal Officer Command Platform — Connected to FastAPI Gateway & OpenStreetMap GIS
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
